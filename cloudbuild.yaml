steps:
  - id: Build and push image
    name: gcr.io/k8s-skaffold/pack
    args:
      - build
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaolle-booking-service/booking-service-git:$COMMIT_SHA
      - --builder=gcr.io/buildpacks/builder:google-24
      - --path=.
      - --publish
      - --env=GOOGLE_RUNTIME_VERSION=25

  - id: Deploy to Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - booking-service-git
      - --image
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kaolle-booking-service/booking-service-git:$COMMIT_SHA
      - --region
      - europe-west1
      - --platform
      - managed
      - --quiet